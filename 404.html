<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa has moved</title>
<meta name="robots" content="noindex">
<script>
// Secret Santa moved to https://secret-santa-draw.github.io
// This sends visitors to the same page there, keeping everything after the address
// (group links, personal links). From the home page it also hands over this device's
// saved groups and language, in the "#import=" part of the link, which never leaves the phone.
(function(){
  var NEW = "https://secret-santa-draw.github.io";
  var path = location.pathname.replace(/^\/secret-santa/, "") || "/";
  var target = NEW + path + location.search + location.hash;
  if ((path === "/" || path === "/index.html") && !location.hash) {
    try {
      var g = localStorage.getItem("ss-my-groups"), l = localStorage.getItem("ss-lang");
      var groups = g ? JSON.parse(g) : {};
      if (Object.keys(groups).length || l) {
        var enc = btoa(unescape(encodeURIComponent(JSON.stringify({ g: groups, l: l }))))
          .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        target = NEW + "/#import=" + enc;
      }
    } catch (e) {}
  }
  location.replace(target);
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>Secret Santa has moved to <a href="https://secret-santa-draw.github.io/">secret-santa-draw.github.io</a>. Taking you there…</p>
</body>
</html>
